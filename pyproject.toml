[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-document-intake"
version = "0.1.0"
description = "Production-grade document intake automation with LLM structured outputs, multi-layer validation, and SQLite idempotency caching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pypdf>=4.2.0",
    "pymupdf>=1.24.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
ai-intake = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

